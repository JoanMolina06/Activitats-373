<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karma</title>
  <meta name="author" content="Joan">
  <link rel="icon" href="./../img/favicon.ico">
  <link rel="stylesheet" href="./../css/karma.css">
</head>
<body>

  <header class="header">
    <a href="#" class="header__logo">
      <img src="./../img/karma-logo.svg" alt="Karma">
    </a>
    <button class="header__menu" aria-label="Menu">
      <img src="./../img/menu-hamburger.svg" alt="">
    </button>
  </header>

  <main>
    <section class="hero">
      <h1 class="hero__title">Introducing Karma</h1>
      <p class="hero__text">Bring WiFi with you, everywhere you go.</p>
      <a href="#" class="hero__btn">Learn More</a>
    </section>

    <section class="features">
      <h2 class="features__title">Everyone needs a little Karma.</h2>

      <div class="features__grid">
        <article class="feature">
          <img src="./../img/icon-devices.svg" alt="">
          <h3>Internet for all devices</h3>
        </article>
        <article class="feature">
          <img src="./../img/icon-coffee.svg" alt="">
          <h3>Boost your productivity</h3>
        </article>
        <article class="feature">
          <img src="./../img/icon-refill.svg" alt="">
          <h3>Pay as You Go</h3>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__join">Join us on</p>
    <ul class="footer__social">
      <li><a href="#"><img src="./../img/twitter-icon.svg" alt="Twitter"></a></li>
      <li><a href="#"><img src="./../img/facebook-icon.svg" alt="Facebook"></a></li>
      <li><a href="#"><img src="./../img/instagram-icon.svg" alt="Instagram"></a></li>
    </ul>
    <p class="footer__copy">&copy; Karma Mobility, Inc.</p>
  </footer>

</body>
</html>
